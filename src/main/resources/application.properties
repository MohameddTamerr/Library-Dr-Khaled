# Server Port
server.port=8080

# Application Name
spring.application.name=Library POS System

# SQLite Profile - ACTIVE
spring.profiles.active=sqlite

# Database Configuration (H2 File-Based for Persistence - Disabled)
# spring.datasource.url=jdbc:h2:file:./data/librarydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update

# Logging
logging.level.org.springframework=INFO
logging.level.com.library.pos=DEBUG

# Receipt printer configuration
# Modes: AUTO, JAVAFX, AWT, ESC_POS
receipt.print.mode=AWT
receipt.printer.name=Xprinter XP-370B
# Optional ESC/POS tuning
# receipt.escpos.paper_width_chars=32
# receipt.escpos.charset=UTF-8
# receipt.escpos.code_table=
# receipt.escpos.enable_cut=true
# receipt.escpos.enable_drawer_kick=false
# receipt.escpos.feed_lines_before_cut=3
# receipt.escpos.arabic_preferred=true

# AWT paper width (mm) for image-based printing
receipt.awt.paper_width_mm=80
# Optional AWT paper height (mm). Leave empty to auto-calc from content.
# receipt.awt.paper_height_mm=
# AWT margins (mm) - reduce to make content closer to edges
receipt.awt.margin_left_mm=0
receipt.awt.margin_right_mm=0
receipt.awt.margin_top_mm=0
receipt.awt.margin_bottom_mm=0
# Scale multiplier (e.g. 1.02 = +2%)
receipt.awt.scale_multiplier=1.00
# AWT offsets (mm). Positive X shifts right, positive Y shifts down.
receipt.awt.offset_x_mm=0
receipt.awt.offset_y_mm=0
