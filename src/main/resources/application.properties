# Server Port
server.port=8080

# Application Name
spring.application.name=Library POS System

# SQLite Profile - ACTIVE
spring.profiles.active=sqlite

# Database Configuration (H2 File-Based for Persistence - Disabled)
# spring.datasource.url=jdbc:h2:file:./data/librarydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update

# Logging
logging.level.org.springframework=INFO
logging.level.com.library.pos=DEBUG
